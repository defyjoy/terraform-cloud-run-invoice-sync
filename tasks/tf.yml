version: '3'

tasks:
  _tf:
    internal: true
    requires:
      vars: [DIR]
    vars:
      # apply and destroy prompt for confirmation; plan has no such flag.
      # Set AUTO_APPROVE=false to get the interactive prompt back.
      APPROVE: '{{if and (ne .ACTION "plan") (ne .AUTO_APPROVE "false")}}-auto-approve{{end}}'
    preconditions:
      - sh: 'case "{{.ACTION}}" in plan|apply|destroy) exit 0 ;; *) exit 1 ;; esac'
        msg: 'ACTION must be plan, apply or destroy (got "{{.ACTION}}")'
    cmds:
      - |
        terraform -chdir={{.DIR}} init -input=false -reconfigure \
          -backend-config="bucket={{.STATE_BUCKET}}" \
          -backend-config="prefix={{.PROJECT_ID}}/{{.DIR}}"
      - |
        {{if eq .ACTION "plan"}}
        terraform -chdir={{.DIR}} plan -input=false -out=tfplan {{.CLI_ARGS}}
        {{else if eq .ACTION "apply"}}
        if [ -f {{.DIR}}/tfplan ]; then
          echo "Applying saved plan {{.DIR}}/tfplan (no -var accepted here — it was fixed at plan time)"
          terraform -chdir={{.DIR}} apply -input=false tfplan
        else
          terraform -chdir={{.DIR}} apply -input=false {{.APPROVE}} {{.CLI_ARGS}}
        fi
        {{else}}
        terraform -chdir={{.DIR}} destroy -input=false {{.APPROVE}} {{.CLI_ARGS}}
        {{end}}
