name: Deploy invoice-sync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: yeti-504903
  REGION: us-central1
  STATE_BUCKET: yeti-terraform-state-bucket
  AR_REPO: invoice-sync
  SERVICE_NAME: invoice-sync

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WIF_PROVIDER and DEPLOY_SA_EMAIL come from live/github-actions-wif's outputs, a
      # separate stack applied by hand once before this pipeline can run at all — see README.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/invoice-sync:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: arduino/setup-task@v2
        with:
          version: "3.x"

      # Same task a human runs locally (`ACTION=apply task invoice-sync`) — the init +
      # backend-config + apply sequence lives once, in Taskfile.yml's _tf task, not duplicated
      # here as raw terraform commands. PROJECT_ID/STATE_BUCKET (this job's env, above) are
      # picked up by Task automatically from the environment — same mechanism this repo's docs
      # already rely on for ACTION (e.g. `ACTION=apply task invoice-sync`) — so the bucket and
      # prefix Taskfile's _tf task builds -backend-config from are parameterized here, not
      # hardcoded a second time. (Backend config can't be read from TF_VAR_* — Terraform only
      # applies that prefix to declared root-module variables, never to backend blocks.)
      - name: Deploy via Taskfile
        run: ACTION=apply task invoice-sync -- -var image_tag=${{ github.sha }}
