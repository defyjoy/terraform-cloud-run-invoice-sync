name: Deploy invoice-sync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: yeti-504903
  REGION: us-central1
  STATE_BUCKET: yeti-terraform-state-bucket
  AR_REPO: invoice-sync
  SERVICE_NAME: invoice-sync

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WIF_PROVIDER and DEPLOY_SA_EMAIL come from live/github-actions-wif's outputs, a
      # separate stack applied by hand once before this pipeline can run at all — see README.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: arduino/setup-task@v2
        with:
          version: "3.x"

      # Same tasks a human runs locally — PROJECT_ID/STATE_BUCKET (job env, above) reach
      # Taskfile.yml's -backend-config via Task's automatic env-var pickup, see CLAUDE.md.
      # enable-apis is bootstrap-only (see README) and is never applied by the pipeline.
      - name: Ensure the Artifact Registry repo and VPC connector exist
        run: |
          ACTION=apply task artifact-registry
          ACTION=apply task network

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/invoice-sync:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy invoice-sync
        run: ACTION=apply task invoice-sync -- -var image_tag=${{ github.sha }}
