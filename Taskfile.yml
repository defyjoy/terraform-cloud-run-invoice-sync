version: '3'

silent: true

vars:
  ACTION: '{{.ACTION | default "plan"}}'
  AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'
  PROJECT_ID: '{{.PROJECT_ID | default "yeti-504903"}}'
  ROOT: live
  STATE_BUCKET: '{{.STATE_BUCKET | default "yeti-terraform-state-bucket"}}'

includes:
  tf:
    taskfile: ./tasks/tf.yml
    internal: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  enable-apis:
    desc: 'Service APIs this repo needs across the project — bootstrap only, applied locally, never by the pipeline (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: tf:_tf
        vars: { DIR: '{{.ROOT}}/enable-apis' }

  github-actions-wif:
    desc: 'GitHub Actions deploy identity (WIF pool/provider/service account) — bootstrap only, apply this locally before the pipeline can run anything else (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: tf:_tf
        vars: { DIR: '{{.ROOT}}/github-actions-wif' }

  artifact-registry:
    desc: 'invoice-sync Artifact Registry repo — applied by the pipeline ahead of docker push, or locally (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: tf:_tf
        vars: { DIR: '{{.ROOT}}/artifact-registry' }

  network:
    desc: 'VPC, Serverless VPC Access connector and firewall rule for invoice-sync — applied by the pipeline ahead of invoice-sync, or locally (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: tf:_tf
        vars: { DIR: '{{.ROOT}}/network' }

  db-secrets:
    desc: 'db-password Secret Manager secret container (no version — add the value out-of-band) — applied by the pipeline ahead of invoice-sync, or locally (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: tf:_tf
        vars: { DIR: '{{.ROOT}}/db-secrets' }

  invoice-sync:
    desc: 'invoice-sync Cloud Run service, load balancer and failure alerting — normally applied by the pipeline, not locally (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: tf:_tf
        vars: { DIR: '{{.ROOT}}/invoice-sync' }

  fmt:
    desc: Format all Terraform files
    cmds:
      - terraform fmt -recursive .

  fmt-check:
    desc: Check Terraform formatting without writing changes (CI)
    cmds:
      - terraform fmt -check -recursive .

  lint:
    desc: Lint every root module with tflint
    cmds:
      - tflint --recursive --config="$(pwd)/.tflint.hcl"

  validate:
    desc: Validate every root module (initializes providers locally, no backend/state access)
    cmds:
      - |
        for component in enable-apis github-actions-wif artifact-registry network db-secrets invoice-sync; do
          echo "==> $component"
          terraform -chdir={{.ROOT}}/$component init -input=false -backend=false
          terraform -chdir={{.ROOT}}/$component validate
        done
