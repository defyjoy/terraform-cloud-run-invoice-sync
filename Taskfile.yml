version: '3'

silent: true

vars:
  ACTION: '{{.ACTION | default "plan"}}'
  AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'
  PROJECT_ID: '{{.PROJECT_ID | default "yeti-504903"}}'
  ROOT: live
  STATE_BUCKET: '{{.STATE_BUCKET | default "yeti-terraform-state-bucket"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  enable-apis:
    desc: 'Service APIs this repo needs across the project — bootstrap only, applied locally, never by the pipeline (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: _tf
        vars: { DIR: '{{.ROOT}}/enable-apis' }

  github-actions-wif:
    desc: 'GitHub Actions deploy identity (WIF pool/provider/service account) — bootstrap only, apply this locally before the pipeline can run anything else (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: _tf
        vars: { DIR: '{{.ROOT}}/github-actions-wif' }

  artifact-registry:
    desc: 'invoice-sync Artifact Registry repo — applied by the pipeline ahead of docker push, or locally (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: _tf
        vars: { DIR: '{{.ROOT}}/artifact-registry' }

  invoice-sync:
    desc: 'invoice-sync Cloud Run service, load balancer and failure alerting — normally applied by the pipeline, not locally (ACTION=plan|apply|destroy, default plan)'
    cmds:
      - task: _tf
        vars: { DIR: '{{.ROOT}}/invoice-sync' }

  fmt:
    desc: Format all Terraform files
    cmds:
      - terraform fmt -recursive .

  validate:
    desc: Validate every root module
    cmds:
      - |
        for component in enable-apis github-actions-wif artifact-registry invoice-sync; do
          echo "==> $component"
          terraform -chdir={{.ROOT}}/$component validate
        done

  _tf:
    internal: true
    requires:
      vars: [DIR]
    vars:
      # apply and destroy prompt for confirmation; plan has no such flag.
      # Set AUTO_APPROVE=false to get the interactive prompt back.
      APPROVE: '{{if and (ne .ACTION "plan") (ne .AUTO_APPROVE "false")}}-auto-approve{{end}}'
    preconditions:
      - sh: 'case "{{.ACTION}}" in plan|apply|destroy) exit 0 ;; *) exit 1 ;; esac'
        msg: 'ACTION must be plan, apply or destroy (got "{{.ACTION}}")'
    cmds:
      - |
        terraform -chdir={{.DIR}} init -input=false -reconfigure \
          -backend-config="bucket={{.STATE_BUCKET}}" \
          -backend-config="prefix={{.PROJECT_ID}}/{{.DIR}}"
      - terraform -chdir={{.DIR}} {{.ACTION}} -input=false {{.APPROVE}} {{.CLI_ARGS}}
